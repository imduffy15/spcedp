name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      PREK_HOME: ${{ github.workspace }}/.cache/prek
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: |
            .cache/uv
            .cache/prek
            .mypy_cache
            .ruff_cache
            .hypothesis
          key: checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'mise.lock', '.pre-commit-config.yaml', 'scripts/validate_ha.py') }}-${{ github.sha }}
          restore-keys: |
            checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'mise.lock', '.pre-commit-config.yaml', 'scripts/validate_ha.py') }}-
            checks-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate and build
        run: mise run ci
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: mise run release-check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spcedp-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Prune dependency cache
        if: always()
        run: mise run cache-prune

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spcedp-dist
          path: dist
      - name: Publish validated artifacts
        run: mise run release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
