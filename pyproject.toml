[project]
name = "spcedp"
version = "2.0.0"
description = "Async Python SDK for Vanderbilt SPC alarm panels (direct EDP v2)"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Ian Duffy", email = "ian@ianduffy.ie" }]
license = "MIT"
keywords = ["vanderbilt", "spc", "alarm", "edp", "home-assistant", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=43",   # for AES-128-ECB (optional EDP frame encryption)
]

[dependency-groups]
dev = [
    "pytest>=8", "pytest-asyncio>=1", "hypothesis>=6.100", "pytest-cov>=5",
    "ruff>=0.15", "pylint>=4", "mypy>=2", "bandit[toml]>=1.8",
    "setuptools>=77", "twine>=6",
]

[project.urls]
Homepage = "https://github.com/imduffy15/spcedp"
Repository = "https://github.com/imduffy15/spcedp"
Issues = "https://github.com/imduffy15/spcedp/issues"
"Protocol notes" = "https://github.com/imduffy15/spcedp/blob/main/PROTOCOL.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spcedp*"]

[tool.setuptools.package-data]
spcedp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.coverage.run]
source = ["spcedp"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover"]
[tool.uv]
# Use the Python that mise provides (see mise.toml), not a uv-downloaded one.
python-preference = "only-system"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "DTZ", "T10", "PIE"]
# Keep exports grouped; protocol APIs deliberately expose per-command timeouts.
ignore = ["RUF022", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# pytest.importorskip("cryptography") must run before importing the modules
# that need it, so those imports are deliberately not at the top of the file.
"tests/test_encryption.py" = ["E402"]
# The session test helper returns a fixed (sess, writer, server, wt) tuple;
# individual tests use different subsets, so some slots go unused.
# Protocol timestamps carry no timezone; socket tests wait on observable state.
"tests/*" = ["RUF059", "ASYNC110", "DTZ001"]
"spcedp/events.py" = ["DTZ001"]

[tool.pylint.main]
py-version = "3.14"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-locals = 18  # Frame.decode unpacks the header field-by-field
max-returns = 9  # Panel.apply_event dispatches on a handful of SIA codes
max-branches = 13  # PanelServer._dispatch routes every major/minor pair

[tool.pylint."messages control"]
disable = [
    "missing-class-docstring",       # thin control wrappers are self-explanatory
    "missing-function-docstring",    # ditto for one-line command methods
    "too-few-public-methods",        # dataclasses / control wrappers
    "too-many-arguments",            # Frame / Session frame builders
    "too-many-positional-arguments",
    "too-many-instance-attributes",  # Session / Frame carry real state
    "duplicate-code",                # the *Control wrappers are intentionally parallel
    "protected-access",              # PanelServer drives Session/decoder internals (same package)
    "broad-exception-caught",        # intentional log-and-continue in teardown / event callbacks
    "import-outside-toplevel",       # cryptography is imported lazily, only when encryption is used
]

[tool.mypy]
python_version = "3.14"
files = ["spcedp", "scripts"]
strict = true

[tool.bandit]
# Internal assertions enforce programmer invariants; no input validation relies on them.
skips = ["B101"]
