# Static-analysis hooks. Run with `prek run --all-files` (prek is a fast,
# drop-in pre-commit runner: https://github.com/j178/prek) or with the classic
# `pre-commit`. Hooks invoke the project's pinned dev tools via uv, so the
# versions match `pip install -e ".[dev]"` / the uv lockfile.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --extra dev ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --extra dev ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: pylint
        name: pylint
        entry: uv run --frozen --extra dev pylint
        language: system
        types: [python]
        files: ^spcedp/        # lint the package; tests use looser conventions
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run --frozen --extra dev mypy
        language: system
        types: [python]
        pass_filenames: false  # mypy checks the whole package via [tool.mypy] files
        require_serial: true
