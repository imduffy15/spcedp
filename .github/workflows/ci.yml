name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise installs uv AND Python 3.14 (from mise.toml); uv uses that Python
      # (tool.uv.python-preference = "only-system") for the project virtualenv.
      - uses: jdx/mise-action@v2

      # Guard against lockfile drift: fail if uv.lock is out of sync with
      # pyproject.toml so --frozen runs below are reproducible.
      - name: Check lockfile is up to date
        run: uv lock --check

      # --cov=spcedp is advisory: coverage is reported but not yet gated
      # (no --cov-fail-under until a baseline is established).
      - name: Run unit tests
        run: uv run --frozen --extra test pytest -v --cov=spcedp

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2

      - name: ruff check
        run: uv run --frozen --extra dev ruff check spcedp/ tests/ examples/

      - name: ruff format --check
        run: uv run --frozen --extra dev ruff format --check spcedp/ tests/ examples/

      - name: pylint
        run: uv run --frozen --extra dev pylint spcedp/

      - name: mypy
        run: uv run --frozen --extra dev mypy
